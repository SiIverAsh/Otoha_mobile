name: Release Android

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本递增：patch 补丁 / minor 小版本 / major 大版本'
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: Mark this release as a prerelease
        type: boolean
        required: true
        default: true

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Calculate the next release version
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/bump-release-version.py "$RELEASE_BUMP" >> "$GITHUB_OUTPUT"
      - name: Validate the release base and refuse an existing version
        uses: actions/github-script@v8
        env:
          TAG: ${{ steps.version.outputs.tag }}
          CURRENT_VERSION: ${{ steps.version.outputs.current_version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.repository.default_branch;
            if (context.ref !== `refs/heads/${branch}`) {
              throw new Error('Run releases from the default branch');
            }
            const head = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (head.data.object.sha !== context.sha) {
              throw new Error('The branch advanced; start a new release run from its latest commit');
            }
            const current = process.env.CURRENT_VERSION.split('.').map(Number);
            const compare = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];
            // Include prereleases: /releases/latest excludes development releases.
            const releases = await github.paginate(github.rest.repos.listReleases, {owner, repo, per_page: 100});
            for (const release of releases) {
              const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.exec(release.tag_name);
              if (!release.draft && match && compare(match.slice(1).map(Number), current) > 0) {
                throw new Error(`Source version is behind ${release.tag_name}; synchronize the version and versionCode first`);
              }
            }
            const tag = process.env.TAG;
            for (const [lookup, message] of [
              [() => github.rest.git.getRef({owner, repo, ref: `tags/${tag}`}), 'Tag already exists'],
              [() => github.rest.repos.getReleaseByTag({owner, repo, tag}), 'Release already exists'],
            ]) {
              try {
                await lookup();
                core.setFailed(message);
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

  checks:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the release version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python3 scripts/bump-release-version.py "$RELEASE_BUMP"
      - name: Test release version increments
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: JVM tests and release lint
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:lintRelease
      - name: Compile source regexes with ICU
        run: |
          sudo apt-get update
          sudo apt-get install --yes libicu-dev
          python3 scripts/check-icu-regex.py
      - name: Upload check reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-check-reports-${{ needs.validate.outputs.tag }}
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  android-regression:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the release version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python3 scripts/bump-release-version.py "$RELEASE_BUMP"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Enable KVM
        run: |
          if [[ ! -e /dev/kvm ]]; then
            sudo modprobe kvm
            if grep -q vmx /proc/cpuinfo; then
              sudo modprobe kvm_intel
            elif grep -q svm /proc/cpuinfo; then
              sudo modprobe kvm_amd
            fi
          fi
          # Set permissions synchronously; udev-triggered updates can race this step.
          sudo chmod a+rw /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
      - name: Run parser regressions on Android 36 ART and ICU
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -accel on
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=io.github.otoha.mobile.AndroidParserCompatibilityTest
      - name: Require all three Android parser tests to have run
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              'playerRefreshWithoutSubtitlesInitializesParser',
              'subtitlePatternsAndAssOverrideRemovalWorkOnAndroidIcu',
              'sourceParserPatternsInitializeOnAndroidIcu',
          }
          seen = set()
          for report in Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'):
              for case in ET.parse(report).iter('testcase'):
                  if not case.get('classname', '').endswith('AndroidParserCompatibilityTest'):
                      continue
                  if any(case.find(kind) is not None for kind in ('failure', 'error', 'skipped')):
                      raise SystemExit('An Android parser regression failed or was skipped')
                  seen.add(case.get('name'))
          if seen != expected:
              raise SystemExit(f'Expected all three Android parser tests; observed: {sorted(seen)}')
          print('All three parser regressions passed on Android 36')
          PY
      - name: Upload Android regression reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-regression-reports-${{ needs.validate.outputs.tag }}
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/apk/androidTest/
          if-no-files-found: warn
          retention-days: 14

  publish:
    needs: [validate, checks, android-regression]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TAG: ${{ needs.validate.outputs.tag }}
      VERSION_CODE: ${{ needs.validate.outputs.version_code }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Apply the release version
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
        run: python3 scripts/bump-release-version.py "$RELEASE_BUMP"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 13114758
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build signed release APK
        env:
          OTOHA_KEYSTORE_BASE64: ${{ secrets.OTOHA_KEYSTORE_BASE64 }}
          OTOHA_KEYSTORE_PASSWORD: ${{ secrets.OTOHA_KEYSTORE_PASSWORD }}
          OTOHA_KEY_ALIAS: ${{ secrets.OTOHA_KEY_ALIAS }}
          OTOHA_KEY_PASSWORD: ${{ secrets.OTOHA_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in OTOHA_KEYSTORE_BASE64 OTOHA_KEYSTORE_PASSWORD OTOHA_KEY_ALIAS OTOHA_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required repository secret: $name" >&2
              exit 1
            fi
          done
          umask 077
          export OTOHA_KEYSTORE_PATH="$RUNNER_TEMP/otoha-release.jks"
          trap 'rm -f -- "$OTOHA_KEYSTORE_PATH"' EXIT
          printf '%s' "$OTOHA_KEYSTORE_BASE64" | base64 --decode > "$OTOHA_KEYSTORE_PATH"
          unset OTOHA_KEYSTORE_BASE64
          ./gradlew --no-daemon --no-configuration-cache -Pkotlin.compiler.execution.strategy=in-process :app:assembleRelease
      - name: Verify version, signing and checksums
        id: package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          tag = os.environ['TAG']
          output = Path('app/build/outputs/apk/release').resolve()
          metadata = json.loads((output / 'output-metadata.json').read_text())
          elements = metadata.get('elements', [])
          if (len(elements) != 1 or elements[0].get('versionName') != tag[1:]
                  or elements[0].get('versionCode') != int(os.environ['VERSION_CODE'])):
              raise SystemExit('APK output-metadata does not match the calculated release version and versionCode')
          apk = (output / elements[0]['outputFile']).resolve()
          if apk.parent != output or apk.suffix != '.apk' or not apk.is_file():
              raise SystemExit('Unexpected release APK output path')
          Path('dist').mkdir(exist_ok=True)
          shutil.copyfile(apk, Path('dist') / f'Otoha-Mobile-{tag}.apk')
          PY
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "dist/Otoha-Mobile-$TAG.apk"
          cd dist
          sha256sum "Otoha-Mobile-$TAG.apk" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload verified signed assets
        if: always() && steps.package.outcome == 'success'
        uses: actions/upload-artifact@v6
        with:
          name: otoha-mobile-signed-${{ needs.validate.outputs.tag }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Save the verified release version to the default branch
        id: commit
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.repository.default_branch;
            if (context.ref !== `refs/heads/${branch}`) {
              throw new Error('Run releases from the default branch');
            }
            const head = await github.rest.git.getRef({owner, repo, ref: `heads/${branch}`});
            if (head.data.object.sha !== context.sha) {
              throw new Error('The branch advanced during checks; start a new release run');
            }
            const base = await github.rest.git.getCommit({owner, repo, commit_sha: context.sha});
            const tree = await github.rest.git.createTree({
              owner, repo, base_tree: base.data.tree.sha,
              tree: [{path: 'app/build.gradle.kts', mode: '100644', type: 'blob',
                content: fs.readFileSync('app/build.gradle.kts', 'utf8')}],
            });
            const commit = await github.rest.git.createCommit({
              owner, repo, message: `Release ${process.env.TAG}`,
              tree: tree.data.sha, parents: [context.sha],
            });
            // A concurrent push makes this non-fast-forward and is rejected.
            await github.rest.git.updateRef({
              owner, repo, ref: `heads/${branch}`, sha: commit.data.sha, force: false,
            });
            core.setOutput('sha', commit.data.sha);
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Creating a new ref atomically fails if somebody created this tag during checks.
          # Never update an existing ref or overwrite an existing release/asset.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$RELEASE_SHA" --silent
          flags=()
          if [[ "$PRERELEASE" == 'true' ]]; then flags+=(--prerelease); fi
          if [[ -s "docs/releases/$TAG.md" ]]; then
            flags+=(--notes-file "docs/releases/$TAG.md")
          else
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" "dist/Otoha-Mobile-$TAG.apk" dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" --verify-tag \
            --title "Otoha Mobile $TAG" "${flags[@]}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url \
            >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: release-build-diagnostics-${{ needs.validate.outputs.tag }}
          path: |
            app/build/outputs/apk/release/output-metadata.json
            app/build/reports/
          if-no-files-found: warn
          retention-days: 14
